apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-manager
    app.kubernetes.io/name: release-aws
    giantswarm.io/cluster: dev01
    giantswarm.io/organization: acme
  name: dev01
  namespace: org-acme
spec:
  interval: 10m
  ref:
    tag: 36.0.0
  url: oci://gsoci.azurecr.io/charts/giantswarm/release-aws
---
apiVersion: v1
data:
  values.yaml: |
    global:
      controlPlane:
        instanceType: m6i.xlarge
      metadata:
        description: Acme's development cluster
        name: dev01
        organization: acme
      providerSpecific:
        awsClusterRoleIdentityName: acme-dev
      release:
        version: 36.0.0
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-manager
    app.kubernetes.io/name: release-aws
    giantswarm.io/cluster: dev01
    giantswarm.io/organization: acme
  name: dev01-values
  namespace: org-acme
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-manager
    app.kubernetes.io/name: release-aws
    giantswarm.io/cluster: dev01
    giantswarm.io/organization: acme
  name: dev01
  namespace: org-acme
spec:
  chartRef:
    kind: OCIRepository
    name: dev01
  install:
    remediation:
      retries: 3
  interval: 10m
  releaseName: dev01
  serviceAccountName: automation
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: cluster-app-installation-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: dev01-values
    valuesKey: values.yaml
