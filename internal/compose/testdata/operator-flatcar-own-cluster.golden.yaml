    kind: OCIRepository
    name: gazelle-gpu-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 10m
  kubeConfig:
    secretRef:
      name: gazelle-kubeconfig
  releaseName: gpu-operator
  storageNamespace: kube-system
  targetNamespace: kube-system
  upgrade:
    crds: CreateReplace
    remediation:
