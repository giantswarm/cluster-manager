apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-manager
    app.kubernetes.io/name: gpu-node-pool
    giantswarm.io/cluster: gazelle
    giantswarm.io/node-pool: gpu-l40s
  name: gazelle-gpu-l40s
  namespace: org-giantswarm
  ownerReferences:
  - apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    name: gazelle
    uid: 6f1c0c1e-8a4a-4c1e-9c3a-000000000001
spec:
  interval: 10m
  ref:
    tag: 0.5.0
  url: oci://gsoci.azurecr.io/charts/giantswarm/gpu-node-pool
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-manager
    app.kubernetes.io/name: gpu-node-pool
    giantswarm.io/cluster: gazelle
    giantswarm.io/node-pool: gpu-l40s
  name: gazelle-gpu-l40s
  namespace: org-giantswarm
  ownerReferences:
  - apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    name: gazelle
    uid: 6f1c0c1e-8a4a-4c1e-9c3a-000000000001
spec:
  chartRef:
    kind: OCIRepository
    name: gazelle-gpu-l40s
  install:
    disableWaitForJobs: true
    remediation:
      retries: 3
  interval: 10m
  releaseName: gazelle-gpu-l40s
  serviceAccountName: automation
  uninstall:
    disableWait: true
  upgrade:
    disableWaitForJobs: true
    remediation:
      retries: 3
  values:
    cluster:
      baseDomain: acme.example.io
      cilium:
        ipamMode: kubernetes
      managementCluster: gazelle
      name: gazelle
      organization: giantswarm
      registryMirrors:
        gsoci.azurecr.io:
        - gsoci.azurecr.io
    pool:
      accelerator: nvidia-l40s
      kubernetesVersion: 1.31.4
      machineImage: flatcar-stable-4081.2.1-kube-1.31.4-tooling-1.26.1-gs
      maxSize:
        nvidia.com/gpu: "1"
      name: gpu-l40s
      prewarm:
        enabled: true
      sizes:
      - 2xlarge
      - 4xlarge
      zones:
      - eu-central-1b
    teleport:
      enabled: true
