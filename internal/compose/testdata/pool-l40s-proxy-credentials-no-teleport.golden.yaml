---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-manager
    app.kubernetes.io/name: gpu-node-pool
    giantswarm.io/cluster: wc1
    giantswarm.io/node-pool: gpu-l40s
  name: wc1-gpu-l40s
  namespace: org-acme
  ownerReferences:
  - apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    name: wc1
    uid: 6f1c0c1e-8a4a-4c1e-9c3a-000000000001
spec:
  chartRef:
    kind: OCIRepository
    name: wc1-gpu-l40s
  install:
    disableWaitForJobs: true
    remediation:
      retries: 3
  interval: 10m
  releaseName: wc1-gpu-l40s
  serviceAccountName: automation
  uninstall:
    disableWait: true
  upgrade:
    disableWaitForJobs: true
    remediation:
      retries: 3
  values:
    cluster:
      baseDomain: acme.example.io
      cilium:
        ipamMode: kubernetes
      managementCluster: gazelle
      name: wc1
      organization: acme
      proxy:
        enabled: true
        httpProxy: http://proxy.acme.example.io:3128
        httpsProxy: http://proxy.acme.example.io:3128
        noProxy: 10.0.0.0/8,.acme.example.io
      registryMirrors:
        docker.io:
        - registry.acme.example.io
        - docker.io
        gsoci.azurecr.io:
        - gsoci.azurecr.io
    pool:
      accelerator: nvidia-l40s
      kubernetesVersion: 1.31.4
      machineImage: flatcar-stable-4459.2.1-kube-1.31.4-tooling-1.26.1-gs
      maxSize:
        nvidia.com/gpu: "4"
      name: gpu-l40s
    teleport:
      enabled: false
  valuesFrom:
  - kind: Secret
    name: wc1-gpu-l40s-values
    valuesKey: values.yaml
