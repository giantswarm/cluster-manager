    app.kubernetes.io/name: gpu-node-pool
    giantswarm.io/cluster: wc1
    giantswarm.io/node-pool: gpu-l40s
  name: wc1-gpu-l40s
  namespace: org-acme
  ownerReferences:
  - apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    name: wc1
