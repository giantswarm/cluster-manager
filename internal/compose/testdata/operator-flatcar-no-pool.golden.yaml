apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-manager
    app.kubernetes.io/name: gpu-operator
    giantswarm.io/cluster: wc1
  name: wc1-gpu-operator
  namespace: org-acme
  ownerReferences:
  - apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    name: wc1
    uid: 6f1c0c1e-8a4a-4c1e-9c3a-000000000001
spec:
  interval: 10m
  ref:
    semver: 1.x
  url: oci://gsoci.azurecr.io/charts/giantswarm/gpu-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-manager
    app.kubernetes.io/name: gpu-operator
    giantswarm.io/cluster: wc1
  name: wc1-gpu-operator
  namespace: org-acme
  ownerReferences:
  - apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    name: wc1
    uid: 6f1c0c1e-8a4a-4c1e-9c3a-000000000001
spec:
  chartRef:
    kind: OCIRepository
    name: wc1-gpu-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 10m
  kubeConfig:
    secretRef:
      name: wc1-kubeconfig
  releaseName: gpu-operator
  storageNamespace: kube-system
  targetNamespace: kube-system
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    gpu-operator:
      daemonsets:
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - key: node.cluster.x-k8s.io/uninitialized
          operator: Exists
        - key: ebs.csi.aws.com/agent-not-ready
          operator: Exists
      dcgmExporter:
        enabled: false
      driver:
        enabled: false
      migManager:
        enabled: false
      node-feature-discovery:
        worker:
          config:
            core:
              sleepInterval: 10s
          tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
            operator: Equal
            value: ""
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
          - key: node.cluster.x-k8s.io/uninitialized
            operator: Exists
          - key: ebs.csi.aws.com/agent-not-ready
            operator: Exists
      toolkit:
        enabled: false
      validator:
        cuda:
          env:
          - name: WITH_WORKLOAD
            value: "false"
        plugin:
          env:
          - name: WITH_WORKLOAD
            value: "false"
