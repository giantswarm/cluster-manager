# The installation's own cluster with a pool of three L40S sizes pinned to
# the model cache claim's zone (pool.zones from cache-claim.yaml's volume,
# giantswarm/cluster-manager#59) whose node Karpenter cannot launch
# (giantswarm/cluster-manager#65), added to installation.yaml and
# cache-claim.yaml: AWS refused all three sizes in the pinned zone at once
# and named the zones that had the capacity, and Karpenter's event carries
# the first size only, cut before AWS's list — the pool's sizes and zones say
# the rest. A second pool of the same shape, not pinned, is refused with the
# whole answer (giantswarm/cluster-manager#75): nine fleet errors, every size
# in every zone, each error's hint naming the two zones the next errors
# refuse — no zone is relayed as having capacity and none advised.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gazelle
  namespace: org-giantswarm
  labels:
    app.kubernetes.io/name: cluster-aws
    giantswarm.io/cluster: gazelle
spec:
  chart:
    spec:
      chart: cluster-aws
      version: 4.2.0
  values:
    global:
      managementCluster: gazelle
      connectivity:
        baseDomain: gazelle.example.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gazelle-bench-11
  namespace: org-giantswarm
  creationTimestamp: "2026-09-18T12:14:20Z"
  labels:
    app.kubernetes.io/name: gpu-node-pool
    app.kubernetes.io/managed-by: cluster-manager
    giantswarm.io/cluster: gazelle
    giantswarm.io/node-pool: bench-11
spec:
  chartRef:
    kind: OCIRepository
    name: gazelle-bench-11
  values:
    pool:
      accelerator: nvidia-l40s
      sizes: [2xlarge, 4xlarge, 8xlarge]
      zones: [eu-central-1b]
status:
  conditions:
    - type: Ready
      status: "True"
      reason: InstallSucceeded
      message: Helm install succeeded for release org-giantswarm/gazelle-bench-11.v1 with chart gpu-node-pool@0.5.0
      lastTransitionTime: "2026-09-18T12:14:22Z"
