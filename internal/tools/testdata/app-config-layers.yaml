# wc2's own release in the workload clusters' GitOps layout: an App CR with
# spec.config and spec.extraConfigs and no spec.userConfig. The layers merge
# to installation.yaml's wc2-user-values: the installation's values under
# the cluster's (priority 10), the cluster's config, a later override of its
# proxy (priority 75).
apiVersion: application.giantswarm.io/v1alpha1
kind: App
metadata:
  name: wc2
  namespace: org-acme
spec:
  catalog: cluster
  name: cluster-aws
  config:
    configMap:
      name: wc2-config
      namespace: org-acme
  extraConfigs:
    - kind: configMap
      name: cluster-app-installation-values
      namespace: org-acme
      priority: 10
    - kind: configMap
      name: wc2-proxy
      namespace: org-acme
      priority: 75
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-app-installation-values
  namespace: org-acme
data:
  values: |
    global:
      managementCluster: gazelle
      connectivity:
        baseDomain: installation.example.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wc2-config
  namespace: org-acme
data:
  values: |
    global:
      connectivity:
        baseDomain: acme.example.io
        proxy:
          enabled: true
          httpProxy: http://old-proxy.acme.example.io:3128
          httpsProxy: http://proxy.acme.example.io:3128
          noProxy:
            addresses:
              - 10.0.0.0/8
              - .acme.example.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wc2-proxy
  namespace: org-acme
data:
  values: |
    global:
      connectivity:
        proxy:
          httpProxy: http://proxy.acme.example.io:3128
