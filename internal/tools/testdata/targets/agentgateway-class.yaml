# The GatewayClass the agentgateway controller creates for itself at startup:
# labelled by no release, it outlives the controller's uninstall
# (giantswarm/cluster-manager#203). With its CRD, which the slice's
# gateway-api-crds component installs beside the Gateway CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gatewayclasses.gateway.networking.k8s.io
spec:
  group: gateway.networking.k8s.io
  names:
    kind: GatewayClass
    plural: gatewayclasses
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: agentgateway
spec:
  controllerName: agentgateway.dev/agentgateway
