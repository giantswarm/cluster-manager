# wc1 with the llm-d controller installed by hand: the controller Deployment
# in the kserve namespace (upstream's control-plane label), no HelmRelease of
# its chart, no discovery ConfigMap.
---
apiVersion: v1
kind: Node
metadata:
  name: wc1-cp-1
  labels: {}
status:
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmisvc-controller-manager
  namespace: kserve
  labels:
    control-plane: llmisvc-controller-manager
spec:
  replicas: 1
status:
  readyReplicas: 1
---
# The controller's admission webhook, serving: its Service has the pod's ready address and the CA bundle is injected.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: llminferenceservice.serving.kserve.io
  annotations:
    cert-manager.io/inject-ca-from: kserve/llmisvc-serving-cert
webhooks:
- name: llminferenceservice.kserve-webhook-server.v1alpha2.defaulter
  clientConfig:
    caBundle: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
    service:
      name: llmisvc-webhook-server-service
      namespace: kserve
      path: /mutate-serving-kserve-io-v1alpha2-llminferenceservice
  failurePolicy: Fail
  rules:
  - apiGroups: [serving.kserve.io]
    apiVersions: [v1alpha2]
    operations: [CREATE, UPDATE]
    resources: [llminferenceservices]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: llminferenceservice.serving.kserve.io
  annotations:
    cert-manager.io/inject-ca-from: kserve/llmisvc-serving-cert
webhooks:
- name: llminferenceservice.kserve-webhook-server.v1alpha2.validator
  clientConfig:
    caBundle: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
    service:
      name: llmisvc-webhook-server-service
      namespace: kserve
      path: /validate-serving-kserve-io-v1alpha2-llminferenceservice
  failurePolicy: Fail
  rules:
  - apiGroups: [serving.kserve.io]
    apiVersions: [v1alpha2]
    operations: [CREATE, UPDATE]
    resources: [llminferenceservices]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: llmisvc-webhook-server-service-x7k2p
  namespace: kserve
  labels:
    kubernetes.io/service-name: llmisvc-webhook-server-service
addressType: IPv4
endpoints:
- addresses: ["10.0.3.17"]
  conditions:
    ready: true
    serving: true
