# wc1 served by the platform's own release: the kserve-llmisvc-resources
# child the agent-platform chart renders (its helm.sh/chart label) and its
# controller Deployment, labelled by Flux with the release that installed it;
# the llmisvc controller not ready yet.
---
apiVersion: v1
kind: Node
metadata:
  name: wc1-cp-1
  labels: {}
status:
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-llmisvc-resources
  namespace: agent-platform
  labels:
    helm.sh/chart: agent-platform-4.44.1
spec:
  chartRef:
    kind: OCIRepository
    name: kserve-llmisvc-resources
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmisvc-controller-manager
  namespace: agent-platform
  labels:
    control-plane: llmisvc-controller-manager
    helm.toolkit.fluxcd.io/name: kserve-llmisvc-resources
    helm.toolkit.fluxcd.io/namespace: agent-platform
spec:
  replicas: 1
status:
  readyReplicas: 0
---
# The controller's admission webhook, not serving yet: its Service's EndpointSlice carries the pod's address, not ready.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: llminferenceservice.serving.kserve.io
  annotations:
    cert-manager.io/inject-ca-from: agent-platform/llmisvc-serving-cert
webhooks:
- name: llminferenceservice.kserve-webhook-server.v1alpha2.defaulter
  clientConfig:
    caBundle: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
    service:
      name: llmisvc-webhook-server-service
      namespace: agent-platform
      path: /mutate-serving-kserve-io-v1alpha2-llminferenceservice
  failurePolicy: Fail
  rules:
  - apiGroups: [serving.kserve.io]
    apiVersions: [v1alpha2]
    operations: [CREATE, UPDATE]
    resources: [llminferenceservices]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: llminferenceservice.serving.kserve.io
  annotations:
    cert-manager.io/inject-ca-from: agent-platform/llmisvc-serving-cert
webhooks:
- name: llminferenceservice.kserve-webhook-server.v1alpha2.validator
  clientConfig:
    caBundle: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
    service:
      name: llmisvc-webhook-server-service
      namespace: agent-platform
      path: /validate-serving-kserve-io-v1alpha2-llminferenceservice
  failurePolicy: Fail
  rules:
  - apiGroups: [serving.kserve.io]
    apiVersions: [v1alpha2]
    operations: [CREATE, UPDATE]
    resources: [llminferenceservices]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: llmisvc-webhook-server-service-x7k2p
  namespace: agent-platform
  labels:
    kubernetes.io/service-name: llmisvc-webhook-server-service
addressType: IPv4
endpoints:
- addresses: ["10.0.3.17"]
  conditions:
    ready: false
    serving: false
