---
apiVersion: v1
kind: Pod
metadata:
  name: llama-3-8b-kserve-6649fb66c8-dllt7
  namespace: model-serving
  labels:
    app.kubernetes.io/name: llama-3-8b
    app.kubernetes.io/part-of: llminferenceservice
spec:
  nodeName: wc1-gpu-a10g-node-1
  containers:
    - name: main
      resources:
