# wc1 as its apiserver shows it once cluster-manager's slice serves models:
# Flatcar nodes, the KServe and llmisvc APIs served, an LLMInferenceService
# model-manager composed (its annotation names the model; Pending, as a
# predictor waiting for its GPU node is) and an InferenceService by hand (the
# model from its storageUri).
---
apiVersion: v1
kind: Node
metadata:
  name: wc1-cp-1
  labels: {}
status:
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: llama-3-8b
  namespace: model-serving
  labels:
    app.kubernetes.io/managed-by: model-manager
    agent-platform.giantswarm.io/preset: llama-3-8b
  annotations:
    model-manager.giantswarm.io/model: meta-llama/Llama-3.1-8B-Instruct
spec:
  model:
    uri: hf://meta-llama/Llama-3.1-8B-Instruct
    name: meta-llama/Llama-3.1-8B-Instruct
  replicas: 1
status:
  conditions:
    - type: Ready
      status: "False"
      reason: HTTPRoutesNotReady
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: mistral-7b
  namespace: model-serving
spec:
  predictor:
    model:
      storageUri: hf://mistralai/Mistral-7B-Instruct-v0.3
---
# The GPU pool's two nodes, registered from Karpenter's NodeClaims. The
# first carries llama-3-8b's predictor: busy. The second carries only what
# holds nothing — the device plugin (a DaemonSet's, on every node of the pool
# by design), the operator's finished CUDA validation, and the pool's prewarm
# placeholder (preemptible by design, a negative priority): idle.
apiVersion: v1
kind: Node
metadata:
  name: wc1-gpu-a10g-node-1
  creationTimestamp: "2026-09-16T10:00:00Z"
  labels:
    giantswarm.io/machine-pool: wc1-gpu-a10g
spec:
  providerID: aws:///eu-west-1a/i-0a1b2c3d4e5f60001
status:
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
apiVersion: v1
kind: Node
metadata:
  name: wc1-gpu-a10g-node-2
  creationTimestamp: "2026-09-16T10:00:00Z"
  labels:
