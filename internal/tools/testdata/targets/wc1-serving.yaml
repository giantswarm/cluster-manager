# wc1 as its apiserver shows it once cluster-manager's slice serves a model:
# Flatcar nodes, the KServe and llmisvc APIs served, one LLMInferenceService.
---
apiVersion: v1
kind: Node
metadata:
  name: wc1-cp-1
  labels: {}
status:
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: llama-3-8b
  namespace: model-serving
spec:
  model:
    uri: hf://meta-llama/Llama-3.1-8B-Instruct
