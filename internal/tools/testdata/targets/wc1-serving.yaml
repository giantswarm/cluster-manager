spec:
  providerID: aws:///eu-west-1b/i-0a1b2c3d4e5f60002
status:
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
apiVersion: karpenter.sh/v1
kind: NodeClaim
