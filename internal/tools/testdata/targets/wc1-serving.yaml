  labels:
    karpenter.sh/nodepool: wc1-gpu-a10g
spec:
  nodeClassRef:
    name: wc1-gpu-a10g
status:
  nodeName: wc1-gpu-a10g-node-1
  providerID: aws:///eu-west-1a/i-0a1b2c3d4e5f60001
  lastPodEventTime: "2026-09-16T12:30:00Z"
  conditions:
    - type: Ready
      status: "True"
      lastTransitionTime: "2026-09-16T10:02:00Z"
