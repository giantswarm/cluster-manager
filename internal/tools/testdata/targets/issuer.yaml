# The fleet's ClusterIssuer as every target runs it: Let's Encrypt, the
# challenges solved by DNS-01 in the cluster's Route53 zone.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-giantswarm
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-giantswarm
    solvers:
    - dns01:
        route53:
          region: eu-west-1
