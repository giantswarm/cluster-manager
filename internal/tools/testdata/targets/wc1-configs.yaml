# wc1 as its apiserver shows it with cluster-manager's serving slice installed
# and no model served: Flatcar nodes, the KServe and llmisvc APIs served, and
# the three of KServe's well-known LLMInferenceServiceConfigs this fixture
# keeps of the ten the slice's kserve-runtime-configs child installs into the
# release namespace, each with the llm-d controller's finalizer. The
# controller's Deployment is not here: a test that needs it running adds it.
---
apiVersion: v1
kind: Node
metadata:
  name: wc1-cp-1
  labels: {}
status:
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-decode-worker-data-parallel
  namespace: org-acme
  labels:
    helm.toolkit.fluxcd.io/name: kserve-runtime-configs
    helm.toolkit.fluxcd.io/namespace: org-acme
  annotations:
    meta.helm.sh/release-name: kserve-runtime-configs
    meta.helm.sh/release-namespace: org-acme
  finalizers:
    - serving.kserve.io/llmisvcconfig-finalizer
spec:
  router: {}
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-scheduler
  namespace: org-acme
  labels:
    helm.toolkit.fluxcd.io/name: kserve-runtime-configs
    helm.toolkit.fluxcd.io/namespace: org-acme
  annotations:
    meta.helm.sh/release-name: kserve-runtime-configs
    meta.helm.sh/release-namespace: org-acme
  finalizers:
    - serving.kserve.io/llmisvcconfig-finalizer
spec:
  router: {}
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: kserve-config-llm-template
  namespace: org-acme
  labels:
    helm.toolkit.fluxcd.io/name: kserve-runtime-configs
    helm.toolkit.fluxcd.io/namespace: org-acme
  annotations:
    meta.helm.sh/release-name: kserve-runtime-configs
    meta.helm.sh/release-namespace: org-acme
  finalizers:
    - serving.kserve.io/llmisvcconfig-finalizer
spec:
  router: {}
---
# The configs' CRD as the slice's kserve-llmisvc-crd child installs it: two
# versions, v1alpha2 the storage version, converted through the llmisvc
# controller's webhook service — gone with the controller's release, so only
# the storage version stays reachable (giantswarm/cluster-manager#39).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llminferenceserviceconfigs.serving.kserve.io
spec:
  group: serving.kserve.io
  names:
    kind: LLMInferenceServiceConfig
    plural: llminferenceserviceconfigs
  scope: Namespaced
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: llmisvc-webhook-server-service
          namespace: org-acme
          path: /convert
      conversionReviewVersions: [v1]
  versions:
    - name: v1alpha1
      served: true
      storage: false
    - name: v1alpha2
      served: true
      storage: true
status:
  storedVersions:
    - v1alpha2
