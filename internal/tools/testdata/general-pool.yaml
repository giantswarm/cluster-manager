# wc1's general-purpose Karpenter pool, made by other means: no pool release,
# its nodes carry the cluster's workloads (targets/wc1-general.yaml).
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: wc1-general
  namespace: org-acme
  labels:
    cluster.x-k8s.io/cluster-name: wc1
spec:
  clusterName: wc1
  replicas: 1
  template:
    spec:
      version: v1.31.4
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KarpenterMachinePool
        name: wc1-general
status:
  replicas: 1
  readyReplicas: 1
  infrastructureReady: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KarpenterMachinePool
metadata:
  name: wc1-general
  namespace: org-acme
spec:
  providerIDList:
    - aws:///eu-west-1a/i-0a1b2c3d4e5f60010
