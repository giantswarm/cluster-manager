# A cluster whose release pins a Flatcar older than 4344.0.0, the first
# release shipping the prebuilt nvidia-drivers system extension a pool node
# takes its driver from (gpu-node-pool 0.6.0). A pool composed for it would
# fail its nodes' boot — refused before anything is composed.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: wc4
  namespace: org-acme
  uid: 6f1c0c1e-8a4a-4c1e-9c3a-000000000004
  labels:
    cluster.x-k8s.io/cluster-name: wc4
    release.giantswarm.io/version: 29.0.0
spec:
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: wc4
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: wc4
  namespace: org-acme
spec:
  version: v1.29.9
---
apiVersion: release.giantswarm.io/v1alpha1
kind: Release
metadata:
  name: aws-29.0.0
spec:
  components:
    - name: kubernetes
      version: 1.29.9
    - name: flatcar
      version: 4230.2.1
    - name: os-tooling
      version: 1.25.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wc4
  namespace: org-acme
spec:
  values:
    global:
      managementCluster: gazelle
      connectivity:
        baseDomain: acme.example.io
