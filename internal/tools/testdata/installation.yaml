# An installation named "gazelle" with its own cluster, one workload cluster
# with a GPU pool from a pool release and a hand-made pool, and one workload
# cluster whose control plane object is not readable (the Release CR answers
# the control plane's version).
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: gazelle
  namespace: org-giantswarm
  labels:
    cluster.x-k8s.io/cluster-name: gazelle
    release.giantswarm.io/version: 31.0.0
spec:
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: gazelle
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: gazelle
  namespace: org-giantswarm
spec:
  version: v1.31.4
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: wc1
  namespace: org-acme
  uid: 6f1c0c1e-8a4a-4c1e-9c3a-000000000001
  labels:
    cluster.x-k8s.io/cluster-name: wc1
    giantswarm.io/organization: acme
    release.giantswarm.io/version: 31.0.0
spec:
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: wc1
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: wc1
  namespace: org-acme
spec:
  version: v1.31.4
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: wc2
  namespace: org-acme
  labels:
    cluster.x-k8s.io/cluster-name: wc2
    release.giantswarm.io/version: 30.1.0
spec:
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: wc2-missing
---
apiVersion: release.giantswarm.io/v1alpha1
kind: Release
metadata:
  name: aws-30.1.0
spec:
  components:
    - name: cluster-aws
      version: 4.2.0
    - name: kubernetes
      version: 1.30.8
    - name: flatcar
      version: 4081.2.0
    - name: os-tooling
      version: 1.26.0
---
apiVersion: release.giantswarm.io/v1alpha1
kind: Release
metadata:
  name: aws-31.0.0
spec:
  components:
    - name: kubernetes
      version: 1.31.4
    - name: flatcar
      version: 4081.2.1
    - name: os-tooling
      version: 1.26.1
---
# The GPU pool release of wc1 (an OCIRepository source: no chart name in the
# spec, the label says which chart it is).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wc1-gpu-a10g
  namespace: org-acme
  labels:
    app.kubernetes.io/name: gpu-node-pool
    app.kubernetes.io/managed-by: cluster-manager
    giantswarm.io/cluster: wc1
    giantswarm.io/node-pool: gpu-a10g
spec:
  chartRef:
    kind: OCIRepository
    name: wc1-gpu-a10g
  values:
    accelerator: nvidia-a10g
    replicas: 2
status:
  lastAttemptedRevision: 0.3.0
  conditions:
    - type: Ready
      status: "True"
---
# A pool release of another cluster in the same namespace: not wc1's, and
# owned by GitOps — create_node_pool never patches it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wc2-gpu-l4
  namespace: org-acme
  labels:
    app.kubernetes.io/name: gpu-node-pool
    giantswarm.io/cluster: wc2
    kustomize.toolkit.fluxcd.io/name: workload-clusters
spec:
  chart:
    spec:
      chart: gpu-node-pool
      version: 0.2.0
---
# Not a pool release at all: the cluster's own release (the fleet's layout),
# whose values ConfigMap is the source of the pool's settings snapshot.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wc1
  namespace: org-acme
  labels:
    app.kubernetes.io/name: cluster-aws
    giantswarm.io/cluster: wc1
spec:
  chart:
    spec:
      chart: cluster-aws
      version: 4.2.0
  valuesFrom:
    - kind: ConfigMap
      name: wc1-userconfig
      valuesKey: values
    - kind: Secret
      name: wc1-userconfig-secret
  values:
    global:
      connectivity:
        cilium:
          ipamMode: kubernetes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wc1-userconfig
  namespace: org-acme
data:
  values: |
    global:
      managementCluster: gazelle
      connectivity:
        baseDomain: acme.example.io
        proxy:
          enabled: false
      components:
        containerd:
          containerRegistries:
            gsoci.azurecr.io:
              - endpoint: gsoci.azurecr.io
            docker.io:
              - endpoint: registry.acme.example.io
                credentials:
                  username: puller
                  password: s3cret
              - endpoint: docker.io
---
# teleport-operator's join token: the pool's nodes join Teleport.
apiVersion: v1
kind: Secret
metadata:
  name: wc1-teleport-join-token
  namespace: org-acme
stringData:
  joinToken: not-read-by-cluster-manager
---
# The source of wc1's pool release.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: wc1-gpu-a10g
  namespace: org-acme
  labels:
    app.kubernetes.io/name: gpu-node-pool
    app.kubernetes.io/managed-by: cluster-manager
    giantswarm.io/cluster: wc1
spec:
  interval: 10m
  url: oci://gsoci.azurecr.io/charts/giantswarm/gpu-node-pool
  ref:
    tag: 0.3.0
---
# wc1's GPU pool, applied by the pool release: a Karpenter pool.
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: wc1-gpu-a10g
  namespace: org-acme
  labels:
    cluster.x-k8s.io/cluster-name: wc1
    helm.toolkit.fluxcd.io/name: wc1-gpu-a10g
    helm.toolkit.fluxcd.io/namespace: org-acme
spec:
  clusterName: wc1
  replicas: 2
  template:
    spec:
      version: v1.31.4
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KarpenterMachinePool
        name: wc1-gpu-a10g
status:
  replicas: 2
  readyReplicas: 2
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KarpenterMachinePool
metadata:
  name: wc1-gpu-a10g
  namespace: org-acme
spec:
  providerIDList:
    - aws:///eu-west-1a/i-0a1b2c3d4e5f60001
    - aws:///eu-west-1b/i-0a1b2c3d4e5f60002
  nodePool:
    template:
      spec:
        requirements:
          - key: karpenter.sh/capacity-type
            operator: In
            values: ["on-demand"]
          - key: node.kubernetes.io/instance-type
            operator: In
            values: ["g5.xlarge", "g5.2xlarge"]
---
# wc1's hand-made pool one version behind, a launch-template pool.
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: wc1-def00
  namespace: org-acme
  labels:
    cluster.x-k8s.io/cluster-name: wc1
spec:
  clusterName: wc1
  replicas: 3
  template:
    spec:
      version: v1.30.8
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSMachinePool
        name: wc1-def00
status:
  replicas: 3
  readyReplicas: 2
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSMachinePool
metadata:
  name: wc1-def00
  namespace: org-acme
spec:
  awsLaunchTemplate:
    instanceType: m5.xlarge
---
# wc2's own release in the management-clusters layout: an App CR with a
# user-values ConfigMap. wc2 has no teleport join token.
apiVersion: application.giantswarm.io/v1alpha1
kind: App
metadata:
  name: wc2
  namespace: org-acme
spec:
  catalog: cluster
  name: cluster-aws
  userConfig:
    configMap:
      name: wc2-user-values
      namespace: org-acme
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wc2-user-values
  namespace: org-acme
data:
  values: |
    global:
      managementCluster: gazelle
      connectivity:
        baseDomain: acme.example.io
        proxy:
          enabled: true
          httpProxy: http://proxy.acme.example.io:3128
          httpsProxy: http://proxy.acme.example.io:3128
          noProxy:
            addresses:
              - 10.0.0.0/8
              - .acme.example.io
---
# wc2's pool: not wc1's, and its infrastructure object is not readable.
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: wc2-gpu-l4
  namespace: org-acme
  labels:
    cluster.x-k8s.io/cluster-name: wc2
spec:
  clusterName: wc2
  template:
    spec:
      version: v1.30.8
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KarpenterMachinePool
        name: wc2-gpu-l4-missing
---
# CAPI's kubeconfig Secret: only the cluster section (apiserver, CA) is read;
# the user section never is.
apiVersion: v1
kind: Secret
metadata:
  name: wc1-kubeconfig
  namespace: org-acme
  labels:
    cluster.x-k8s.io/cluster-name: wc1
type: cluster.x-k8s.io/secret
data:
  value: 
---
# CAPI's kubeconfig Secret: only the cluster section (apiserver, CA) is read;
# the user section never is.
apiVersion: v1
kind: Secret
metadata:
  name: wc2-kubeconfig
  namespace: org-acme
  labels:
    cluster.x-k8s.io/cluster-name: wc2
type: cluster.x-k8s.io/secret
data:
  value: 
---
# The installation's own node: Flatcar, no GPU.
apiVersion: v1
kind: Node
metadata:
  name: gazelle-cp-1
  labels:
    node-role.kubernetes.io/control-plane: ""
status:
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
# The installation's own release of the agent-platform chart, as the fleet
# installs it: the slice release reads global.domain, global.identity and the
# wildcard certificate from its values — never from a Secret — and pins the
# chart version it runs (status.history[0].chartVersion, the chart's digest
# recorded as build metadata the way Flux writes it).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-platform
  namespace: flux-giantswarm
  labels:
    kustomize.toolkit.fluxcd.io/name: flux-giantswarm
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: agent-platform
  valuesFrom:
    - kind: ConfigMap
      name: agent-platform-values
    - kind: Secret
      name: agent-platform-secret-values
  values:
    gatewayApi:
      gateway:
        tls:
          secretName: gazelle-wildcard-tls
status:
  lastAttemptedRevision: 4.27.2+b9d9972a5aca
  history:
    - chartName: agent-platform
      chartVersion: 4.27.2+b9d9972a5aca
      name: agent-platform
      namespace: agent-platform
      status: deployed
      version: 143
    - chartName: agent-platform
      chartVersion: 4.27.0+3f2a9c1d8e6b
      name: agent-platform
      namespace: agent-platform
      status: superseded
      version: 142
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agent-platform
  namespace: flux-giantswarm
spec:
  interval: 10m
  url: oci://gsoci.azurecr.io/charts/giantswarm/agent-platform
  ref:
    semver: 4.x
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-values
  namespace: flux-giantswarm
data:
  values.yaml: |
    global:
      domain: gazelle.example.io
      identity:
        issuerUrl: https://dex.gazelle.example.io
        clientId: dex-k8s-authenticator
        existingSecret: agent-platform-identity
    components:
      muster:
        enabled: true
