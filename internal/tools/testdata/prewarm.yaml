# The installation's own cluster with a pool created with prewarm
# (giantswarm/cluster-manager#48), added to installation.yaml: the cluster's
# own values (the settings snapshot create_node_pool reads), a ready pool
# release carrying pool.prewarm.enabled, its MachinePool with one node, and
# the placeholder Job whose pod holds that node in the release namespace.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gazelle
  namespace: org-giantswarm
  labels:
    app.kubernetes.io/name: cluster-aws
    giantswarm.io/cluster: gazelle
spec:
  chart:
    spec:
      chart: cluster-aws
      version: 4.2.0
  values:
    global:
      managementCluster: gazelle
      connectivity:
        baseDomain: gazelle.example.io
        cilium:
          ipamMode: kubernetes
      components:
        containerd:
          containerRegistries:
            gsoci.azurecr.io:
              - endpoint: gsoci.azurecr.io
---
apiVersion: v1
kind: Secret
metadata:
  name: gazelle-teleport-join-token
  namespace: org-giantswarm
stringData:
  joinToken: not-read-by-cluster-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gazelle-gpu-l4
  namespace: org-giantswarm
  creationTimestamp: "2026-09-18T06:00:00Z"
  labels:
    app.kubernetes.io/name: gpu-node-pool
    app.kubernetes.io/managed-by: cluster-manager
    giantswarm.io/cluster: gazelle
    giantswarm.io/node-pool: gpu-l4
spec:
  chartRef:
    kind: OCIRepository
    name: gazelle-gpu-l4
  values:
    pool:
      accelerator: nvidia-l4
      sizes: [xlarge, 2xlarge]
      prewarm:
        enabled: true
status:
  conditions:
    - type: Ready
      status: "True"
      reason: InstallSucceeded
      message: Helm install succeeded for release org-giantswarm/gazelle-gpu-l4.v1 with chart gpu-node-pool@0.4.1
      lastTransitionTime: "2026-09-18T06:00:09Z"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gazelle-gpu-l4
  namespace: org-giantswarm
  labels:
    app.kubernetes.io/managed-by: cluster-manager
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: gazelle-gpu-l4
  namespace: org-giantswarm
  creationTimestamp: "2026-09-18T06:00:08Z"
  labels:
    cluster.x-k8s.io/cluster-name: gazelle
    helm.toolkit.fluxcd.io/name: gazelle-gpu-l4
    helm.toolkit.fluxcd.io/namespace: org-giantswarm
spec:
  clusterName: gazelle
  replicas: 1
  template:
    spec:
      version: v1.31.4
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KarpenterMachinePool
        name: gazelle-gpu-l4
status:
  replicas: 1
  readyReplicas: 1
  infrastructureReady: true
  conditions:
    - type: Ready
      status: "True"
      lastTransitionTime: "2026-09-18T06:04:30Z"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KarpenterMachinePool
metadata:
  name: gazelle-gpu-l4
  namespace: org-giantswarm
spec:
  providerIDList:
    - aws:///eu-central-1a/i-0a1b2c3d4e5f60011
  nodePool:
    template:
      spec:
        requirements:
          - key: node.kubernetes.io/instance-type
            operator: In
            values: ["g6.xlarge", "g6.2xlarge"]
---
# The first node, launched for the placeholder: its NodeClaim and the Node
# registered from it, as the installation's own cluster shows them.
apiVersion: karpenter.sh/v1
kind: NodeClaim
metadata:
  name: gazelle-gpu-l4-x7k2p
  creationTimestamp: "2026-09-18T06:00:31Z"
  labels:
    karpenter.sh/nodepool: gazelle-gpu-l4
spec:
  nodeClassRef:
    name: gazelle-gpu-l4
status:
  providerID: aws:///eu-central-1a/i-0a1b2c3d4e5f60011
  nodeName: ip-10-0-1-23.eu-central-1.compute.internal
  conditions:
    - type: Ready
      status: "True"
      lastTransitionTime: "2026-09-18T06:04:30Z"
---
apiVersion: v1
kind: Node
metadata:
  name: ip-10-0-1-23.eu-central-1.compute.internal
  creationTimestamp: "2026-09-18T06:02:10Z"
  labels:
    giantswarm.io/machine-pool: gazelle-gpu-l4
    karpenter.sh/nodepool: gazelle-gpu-l4
    node.kubernetes.io/instance-type: g6.xlarge
spec:
  providerID: aws:///eu-central-1a/i-0a1b2c3d4e5f60011
status:
  conditions:
    - type: Ready
      status: "True"
      lastTransitionTime: "2026-09-18T06:04:30Z"
  nodeInfo:
    osImage: Flatcar Container Linux by Kinvolk 4081.2.1 (Oklo)
---
# The placeholder: created with the release's install, one pod holding the
# first node's GPU at negative priority (the chart's labels on the pod select
# it; the priority keeps it from counting as a holder of the node).
apiVersion: batch/v1
kind: Job
metadata:
  name: gazelle-gpu-l4-prewarm
  namespace: org-giantswarm
  creationTimestamp: "2026-09-18T06:00:08Z"
  labels:
    app.kubernetes.io/name: gpu-node-pool
    app.kubernetes.io/instance: gazelle-gpu-l4
    giantswarm.io/machine-pool: gazelle-gpu-l4
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  ttlSecondsAfterFinished: 600
status:
  active: 1
  startTime: "2026-09-18T06:00:08Z"
---
apiVersion: v1
kind: Pod
metadata:
  name: gazelle-gpu-l4-prewarm-x7k2p
  namespace: org-giantswarm
  creationTimestamp: "2026-09-18T06:00:08Z"
  labels:
    app.kubernetes.io/name: gpu-node-pool
    app.kubernetes.io/instance: gazelle-gpu-l4
    giantswarm.io/machine-pool: gazelle-gpu-l4
    batch.kubernetes.io/job-name: gazelle-gpu-l4-prewarm
spec:
  nodeName: ip-10-0-1-23.eu-central-1.compute.internal
  priorityClassName: agent-platform-prewarm-placeholder
  priority: -1000
  containers:
    - name: hold
      image: gsoci.azurecr.io/giantswarm/alpine:3.22.1
      resources:
        requests:
          nvidia.com/gpu: "1"
status:
  phase: Running
  startTime: "2026-09-18T06:04:41Z"
  conditions:
    - type: PodScheduled
      status: "True"
      lastTransitionTime: "2026-09-18T06:04:35Z"
