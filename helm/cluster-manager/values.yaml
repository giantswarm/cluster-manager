# Default values for cluster-manager.

# -- Platform-wide values a parent chart (the `agent-platform` meta chart) shares
# with every component; Helm forwards them to this chart. `oauth.*` reads the
# identity contract as its defaults: `global.identity.issuerUrl`,
# `global.identity.clientId`, `global.identity.existingSecret`,
# `global.identity.ca.secretName` / `.key`, and `global.domain` for the OAuth
# base URL. Empty here; a chart installed on its own sets `oauth.*` directly.
global: {}  # @schema type: object; additionalProperties: true

# -- Number of replicas. The server holds no state; more than one is fine.
replicaCount: 1

image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  repository: giantswarm/cluster-manager
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""

installation:
  # -- Name of the installation. `list_clusters` reports the Cluster of that
  # name as the installation's own cluster (its management cluster); empty
  # marks none.
  name: ""

modelManager:
  # -- Namespace model-manager runs in on the installation. `create_node_pool`
  # registers the serving cluster's `kserve` backend there by writing the
  # `model-backend-kserve` ConfigMap of model-manager's runtime-registration
  # contract; `delete_node_pool` of the cluster's last pool removes it;
  # `enable_model_serving` and `disable_model_serving` register and remove it too.
  namespace: agent-platform

serving:
  # -- Namespace on a serving cluster where the LLMInferenceServices go, named
  # as `target.servingNamespace` in the registered `kserve` backend.
  namespace: model-serving
  # -- Base name of the model cache `PersistentVolumeClaim`s in the serving
  # namespace (the connectivity chart's default `modelServing.cache.pvc.name`).
  # A claim outlives the pool and is one volume bound in one zone, so the
  # cache is one claim per zone: `create_node_pool` with `zones` composes the
  # zone's claim into the pool's slice — the claim Bound there, else
  # `<cacheClaim>-<zone>` — and pins the pool's nodes to the zone (the
  # gpu-node-pool chart's `pool.zones`); `list_clusters` names every claim
  # with its zone under serving readiness.
  cacheClaim: hf-cache
  # -- Exact `agent-platform` chart version the `<cluster>-agent-platform`
  # slice release pins. Empty pins the version the installation's own
  # platform release runs (at least 4.44.0, the first chart whose serving
  # slice is the llm-d control plane alone); set it only for a lab running an
  # unreleased chart.
  sliceChartVersion: ""
  # -- cert-manager `ClusterIssuer` the `<cluster>-agent-platform` slice release
  # asks for the certificate of `models.<domain>` when the platform's wildcard
  # is not usable: on a workload cluster (another domain) and on the
  # installation's own cluster when the platform's release names no
  # `gatewayApi.gateway.tls.secretName` (TLS terminated at the fleet's edge
  # Gateway, its wildcard in another namespace). `letsencrypt-giantswarm` is the
  # issuer every Giant Swarm cluster runs. Empty composes none — the
  # connectivity chart then refuses a models Gateway without a certificate.
  certificateIssuer: letsencrypt-giantswarm

gpuOperator:
  # -- Run NVIDIA's DCGM exporter on the GPU pools' nodes through the composed
  # `<cluster>-gpu-operator` release (its `dcgmExporter.enabled`), for an
  # installation whose observability scrapes it (a ServiceMonitor on the
  # `nvidia-dcgm-exporter` Service in `kube-system`). Off by default: nothing
  # scrapes the exporter out of the box, and on a fresh pool node it is an image
  # pull and a pod initialising DCGM on the GPU while the device plugin brings
  # `nvidia.com/gpu` up.
  dcgmExporter: false

flux:
  # -- ServiceAccount in every org namespace the installation's Flux runs a
  # composed release under when the release's objects live in that namespace:
  # the pool release (its Cluster API objects) and the `<cluster>-agent-platform`
  # slice release (its child HelmReleases). Giant Swarm installations enforce the
  # `flux-multi-tenancy` policy on every HelmRelease in `org-<org>` — a
  # `serviceAccountName` or a kubeconfig on each —, and `automation` is the org's
  # tenant ServiceAccount there. A release installing into a cluster (the
  # `<cluster>-gpu-operator` release, the slice's children) is delivered through
  # the cluster's `<cluster>-kubeconfig` Secret instead, the installation's own
  # cluster included. Empty renders none, for a lab without the policy.
  tenantServiceAccount: automation

mcp:
  # -- Serve the MCP streamable-HTTP endpoint (the server's only surface).
  enabled: true
  # -- MCP endpoint path.
  path: /mcp

oauth:
  # -- Make cluster-manager an OAuth 2.1 resource server (mcp-oauth): the MCP
  # endpoint requires a bearer token the platform identity provider issued,
  # and every call carries the caller's identity. On the Agent Platform muster
  # forwards the session's IdP id_token to this server (MCPServer
  # `auth.forwardToken`, rendered below) and the portal's calls arrive the
  # same way through muster; both are validated against the IdP's JWKS when
  # their audience is in `trustedAudiences`. Off: anonymous, acting as the
  # ServiceAccount — only for a server nothing but a trusted proxy can reach.
  enabled: false
  # -- Public base URL of this server: the issuer of its own OAuth metadata
  # (https, or http on loopback). Empty derives
  # `https://<fullname>.<global.domain>` when `global.domain` is set.
  baseURL: ""
  # -- Identity provider: `dex` or `google`.
  provider: dex
  dex:
    # -- Dex issuer URL. Empty falls back to `global.identity.issuerUrl`.
    issuerURL: ""
    # -- Dex OAuth client ID. Empty falls back to `global.identity.clientId`.
    clientID: ""
    # -- Dex OAuth client secret (prefer `oauth.existingSecret`).
    clientSecret: ""
    # -- Let the issuer resolve to a private or loopback address (an
    # in-cluster Dex).
    allowPrivateURLs: false
    # -- Secret with the CA of a Dex that serves a private certificate;
    # mounted and passed as `--dex-ca-file`. Empty name falls back to
    # `global.identity.ca.secretName` / `global.identity.ca.key`.
    caSecret:
      name: ""
      key: ca.crt
  google:
    # -- Google OAuth client ID (not secret; may also come from the Secret key
    # `google-client-id` when empty).
    clientID: ""
    # -- Google OAuth client secret (prefer `oauth.existingSecret`).
    clientSecret: ""
  # -- Existing Secret with the provider credentials: `dex-client-secret`
  # (dex) or `google-client-secret` (+ optional `google-client-id`) (google).
  # Empty falls back to `global.identity.existingSecret`, whose
  # `dex-client-secret` is the platform client's; without that, the chart
  # renders a Secret from the values above.
  existingSecret: ""
  # -- OAuth client IDs whose IdP id_tokens are accepted as bearer tokens (SSO
  # token forwarding). Empty falls back to `[global.identity.clientId]`, the
  # platform client MCP clients and the muster CLI log in with. The server
  # trusts the union of this list and `muster.mcpServer.auth.requiredAudiences`
  # (in that order, without duplicates): every token muster forwards carries
  # the required audiences by construction and they are what the
  # kube-apiserver trusts, so a portal session — whose id_token carries them
  # but not the platform client — is accepted without listing its client here.
  trustedAudiences: []
  sso:
    # -- Let the IdP's JWKS endpoint resolve to a private address when
    # validating forwarded tokens (an in-cluster Dex).
    allowPrivateIPs: false
  # -- Accept unauthenticated dynamic client registration (labs only).
  allowPublicClientRegistration: false
  downstream:
    # -- Call the Kubernetes API as the caller: everything a request does
    # presents the caller's IdP token, so the caller's RBAC governs — the
    # apiserver must trust the IdP and the token's audience (a Dex install
    # lists that audience in `muster.mcpServer.auth.requiredAudiences`; a
    # Google install's client id is the apiserver's `--oidc-client-id`). This
    # is cluster-manager's rule (every write as the person), so it is on by
    # default and takes effect with `oauth.enabled`. The ServiceAccount then
    # holds no permissions: the chart renders no RBAC for it (`rbac.create`
    # is moot).
    enabled: true

github:
  # -- Register with muster pinned to the GitHub App
  # `giantswarm-cluster-manager` and offer commit mode (`mode: commit` on
  # `create_node_pool` and `delete_node_pool`: the pull request opened as the
  # person in the repository that owns the cluster). The MCPServer's auth then
  # pins the App as the authorization server — muster runs the App's consent
  # once per person and puts their user token on every call, which this server
  # verifies with `GET /user` and opens the pull request with — and sets
  # `forwardIdentity: true`: muster forwards the person's IdP ID token in
  # `X-Muster-Id-Token` next to it, validated as `oauth` validates a forwarded
  # token, so apply mode keeps acting on Kubernetes as the person. One
  # registration carries both tokens. Needs `oauth.enabled`. Off: muster
  # forwards the ID token as the bearer (`muster.mcpServer.auth.forwardToken`)
  # and commit mode is refused.
  enabled: false
  # -- GitHub's REST API, for `GET /user` and the pull request.
  apiURL: https://api.github.com
  authorizationServer:
    # -- The issuer identity the person's grant is filed under: the App's own,
    # so the login App's GitHub grant stays separate. Also passed to the
    # server, which names it in its refusals.
    issuer: https://github.com/apps/giantswarm-cluster-manager
    # -- The issuer GitHub puts in the RFC 9207 `iss` parameter of its
    # authorization response, `https://github.com/login/oauth` for every App.
    # Empty omits the field.
    expectedIssuer: https://github.com/login/oauth
    # -- GitHub's authorize endpoint (GitHub publishes no discovery document).
    authorizationEndpoint: https://github.com/login/oauth/authorize
    # -- GitHub's token endpoint.
    tokenEndpoint: https://github.com/login/oauth/access_token
    # -- The OAuth `scope` parameter, only for an authorization server that
    # needs one (a lab's stand-in); empty for GitHub, whose App permissions are
    # the App's. Empty omits the field.
    scopes: ""
    clientCredentialsSecretRef:
      # -- Secret with the App's OAuth client under `client-id` and
      # `client-secret`.
      name: giantswarm-cluster-manager-oauth-client
      # -- Namespace of that Secret; empty is the release namespace.
      namespace: ""
    # -- `subject`: the grant belongs to the person, not to one login session.
    grantScope: subject

muster:
  mcpServer:
    # -- Register this server with muster by rendering an
    # `mcpservers.muster.giantswarm.io` CR in the release namespace. Tools then
    # appear as `x_<name>_<tool>`.
    enabled: false
    # -- MCPServer CR name (drives the tool prefix).
    name: cluster-manager
    # -- Start the server connection when muster initializes.
    autoStart: true
    # -- Human-readable description shown by muster.
    description: Clusters and GPU node pools of this installation (list, and the node-pool writes as the person) for the Agent Platform
    # -- Extra labels on the MCPServer CR.
    labels: {}  # @schema additionalProperties: true
    # -- How muster authenticates to this server; rendered only with
    # `oauth.enabled`. `forwardToken` makes muster forward the session's IdP
    # id_token byte-identical (the SSO path this chart trusts through its
    # trusted audiences). `requiredAudiences` are extra audiences that token
    # must carry — the Dex cross-client audience the kube-apiserver trusts
    # (`dex-k8s-authenticator` on Giant Swarm clusters; agentlab's is
    # `kubernetes`) so `oauth.downstream` works; muster requests them at
    # login, so users re-login after a change. They are trusted as bearer
    # audiences by construction, since the server's trusted audiences are
    # `oauth.trustedAudiences` plus this list. A Google IdP has no
    # cross-client audiences: leave the list empty.
    auth:
      forwardToken: true
      requiredAudiences: []

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount.
  annotations: {}  # @schema additionalProperties: true
  # -- ServiceAccount name (generated when empty).
  name: ""

rbac:
  # -- Create the read-only ClusterRole/ClusterRoleBinding (Cluster API
  # clusters, machine pools, control planes and infrastructure, Flux
  # HelmReleases, Giant Swarm Releases) — the ServiceAccount's own
  # permissions for a release without OAuth. Ignored with `oauth.enabled` and
  # `oauth.downstream.enabled`: the ServiceAccount then gets no RBAC at all.
  create: true

# -- Annotations on the pod.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod.
podLabels: {}  # @schema additionalProperties: true

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (container listens on 8080).
  port: 8080

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

logging:
  # -- Enable debug logging.
  verbose: false

observability:
  otel:
    # -- OTLP collector the server exports its traces to
    # (`OTEL_EXPORTER_OTLP_ENDPOINT`), e.g.
    # `http://otlp-gateway.kube-system.svc:4317` for gRPC. Empty exports
    # nothing; the W3C propagator still honours an inbound `traceparent`.
    endpoint: ""
    # -- OTLP protocol: `grpc` or `http/protobuf`
    # (`OTEL_EXPORTER_OTLP_PROTOCOL`).
    protocol: grpc
    # -- Extra OTLP headers as `key=value,...` (`OTEL_EXPORTER_OTLP_HEADERS`),
    # e.g. `X-Scope-OrgID=giantswarm` for the collector's tenant.
    headers: ""
    # -- Extra resource attributes as `key=value,...`, appended to the pod's
    # `k8s.pod.name`, `k8s.namespace.name` and `k8s.node.name`
    # (`OTEL_RESOURCE_ATTRIBUTES`).
    resourceAttributes: ""
    # -- Trace sampler (`OTEL_TRACES_SAMPLER`). Parent-based: a call
    # arriving with a sampled `traceparent` (muster's) is always kept, a root
    # span is sampled at `samplerArg`.
    sampler: parentbased_traceidratio
    # -- Sampler argument (`OTEL_TRACES_SAMPLER_ARG`): the ratio of root spans kept.
    samplerArg: "0.1"

# -- Extra container arguments.
extraArgs: []
# -- Extra environment variables.
extraEnv: []  # @schema item: object ; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}

# -- Node selector.
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations.
tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
# -- Affinity.
affinity: {}  # @schema additionalProperties: true
