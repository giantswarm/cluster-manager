# Default values for cluster-manager.

# -- Platform-wide values a parent chart (the `agent-platform` meta chart) shares
# with every component; Helm forwards them to this chart. `oauth.*` reads the
# identity contract as its defaults: `global.identity.issuerUrl`,
# `global.identity.clientId`, `global.identity.existingSecret`,
# `global.identity.ca.secretName` / `.key`, and `global.domain` for the OAuth
# base URL. Empty here; a chart installed on its own sets `oauth.*` directly.
global: {}  # @schema type: object; additionalProperties: true

# -- Number of replicas. The server holds no state; more than one is fine.
replicaCount: 1

# -- Old ReplicaSets the Deployment keeps. Kubernetes defaults to 10; fewer keeps stale pod templates out of the PolicyReport.
revisionHistoryLimit: 3

image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  repository: giantswarm/cluster-manager
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""

installation:
  # -- Name of the installation. `list_clusters` reports the Cluster of that
  # name as the installation's own cluster (its management cluster); empty
  # marks none.
  name: ""

createdClusters:
  # The identity provider a cluster `create_cluster` makes trusts
  # (`global.controlPlane.oidc` of its values): the Dex this server validates
  # the person's id_token against (`oauth.dex.issuerURL`, else
  # `global.identity.issuerUrl`, with its CA), so the calls to the cluster as
  # the person (`oauth.downstream`) are authenticated. Composed only with the
  # dex provider and an audience; a caller's own `global.controlPlane.oidc`
  # wins.
  oidc:
    # -- Audience the cluster's apiserver accepts in the person's id_token;
    # empty is the first of `muster.mcpServer.auth.requiredAudiences`, the
    # cross-client audience muster requests at login. Both empty: created
    # clusters trust no identity provider.
    clientID: ""
    # -- id_token claim the cluster's apiserver takes as the username.
    usernameClaim: email
    # -- id_token claim the cluster's apiserver takes as the groups.
    groupsClaim: groups

modelManager:
  # -- Namespace model-manager runs in on the installation. `create_node_pool`
  # registers each serving cluster's kserve backend there by writing its
  # ConfigMap of model-manager's runtime-registration contract
  # (`model-backend-kserve` for the installation's own cluster,
  # `model-backend-kserve-<cluster>` for a workload cluster); `delete_node_pool`
  # of the cluster's last pool removes that cluster's;
  # `enable_model_serving` and `disable_model_serving` register and remove it too.
  namespace: agent-platform

serving:
  # -- Namespace on a serving cluster where the LLMInferenceServices go, named
  # as `target.servingNamespace` in the registered `kserve` backend.
  namespace: model-serving
  # -- Base name of the model cache `PersistentVolumeClaim`s in the serving
  # namespace (the connectivity chart's default `modelServing.cache.pvc.name`).
  # A claim outlives the pool and is one volume bound in one zone, so the
  # cache is one claim per zone: `create_node_pool` with `zones` composes the
  # zone's claim into the pool's slice — the claim Bound there, else
  # `<cacheClaim>-<zone>` — and pins the pool's nodes to the zone (the
  # gpu-node-pool chart's `pool.zones`); `list_clusters` names every claim
  # with its zone under serving readiness.
  cacheClaim: hf-cache
  # -- Exact `agent-platform` chart version the `<cluster>-agent-platform`
  # slice release pins. Empty follows the chart from the version the
  # installation's own platform release runs (at least 4.85.0, the first chart
  # that names a targeted release's children per target) to the next major;
  # set it only for a lab running an unreleased chart.
  sliceChartVersion: ""
  # -- cert-manager `ClusterIssuer` the `<cluster>-agent-platform` slice release
  # asks for the certificate of `models.<domain>` when the platform's wildcard
  # is not usable: on a workload cluster (another domain) and on the
  # installation's own cluster when the platform's release names no
  # `gatewayApi.gateway.tls.secretName` (TLS terminated at the fleet's edge
  # Gateway, its wildcard in another namespace). `letsencrypt-giantswarm` is the
  # issuer every Giant Swarm cluster runs. Empty composes none — the
  # connectivity chart then refuses a models Gateway without a certificate.
  certificateIssuer: letsencrypt-giantswarm

gpuOperator:
  # -- Run NVIDIA's DCGM exporter on the GPU pools' nodes through the composed
  # `<cluster>-gpu-operator` release (its `dcgmExporter.enabled`), for an
  # installation whose observability scrapes it (a ServiceMonitor on the
  # `nvidia-dcgm-exporter` Service in `kube-system`). Off by default: nothing
  # scrapes the exporter out of the box, and on a fresh pool node it is an image
  # pull and a pod initialising DCGM on the GPU while the device plugin brings
  # `nvidia.com/gpu` up.
  dcgmExporter: false

flux:
  # -- ServiceAccount in every org namespace the installation's Flux runs a
  # composed release under when the release's objects live in that namespace:
  # the pool release (its Cluster API objects) and the `<cluster>-agent-platform`
  # slice release (its child HelmReleases). Giant Swarm installations enforce the
  # `flux-multi-tenancy` policy on every HelmRelease in `org-<org>` — a
  # `serviceAccountName` or a kubeconfig on each —, and `automation` is the org's
  # tenant ServiceAccount there. A release installing into a cluster (the
  # `<cluster>-gpu-operator` release, the slice's children) is delivered through
  # the cluster's `<cluster>-kubeconfig` Secret instead, the installation's own
  # cluster included. Empty renders none, for a lab without the policy.
  tenantServiceAccount: automation

mcp:
  # -- Serve the MCP streamable-HTTP endpoint (the server's only surface).
  enabled: true
  # -- MCP endpoint path.
  path: /mcp

oauth:
  # -- Make cluster-manager an OAuth 2.1 resource server (mcp-oauth): the MCP
  # endpoint requires a bearer token, and every call carries the caller's
  # identity. On the Agent Platform muster forwards the session's IdP ID token
  # to this server (MCPServer `auth.forwardToken`, rendered below) and the
  # portal's calls arrive the same way through muster; both are accepted from
  # the provider people sign in with (`resourceServer.trustedIssuers`). Off:
  # anonymous, acting as the ServiceAccount, only for a server nothing but a
  # trusted proxy can reach.
  enabled: false
  # The protected resource: which tokens are accepted (mcp-oauth's values
  # layout for MCP servers).
  resourceServer:
    # -- The main protected resource, by its full URL (`OAUTH_RESOURCE`).
    # Empty uses the issuer.
    resource: ""
    # -- Further protected resources on the same origin, each by its full URL
    # (`OAUTH_ADDITIONAL_RESOURCES`). The MCP endpoint is always a protected
    # resource.
    additionalResources: []  # @schema item: string
    # -- Issuer identifiers the resource metadata advertises
    # (`OAUTH_AUTHORIZATION_SERVERS`, RFC 9728 `authorization_servers`): this
    # server's issuer or a trusted issuer. Empty advertises this server's
    # issuer; required with `authorizationServer.enabled` false, since MCP
    # clients find the authorization server here.
    authorizationServers: []  # @schema item: string
    # -- The issuers whose JWTs are accepted (`OAUTH_TRUSTED_ISSUERS`). A
    # trust anchor: set it only from the release's own values or a
    # GitOps-managed ConfigMap that only installation administrators write.
    # Each entry: `issuer`, `jwksURI` and `audiences` (required),
    # `subjectClaim` (`sub` or `email`), `acceptedTypHeaders`,
    # `allowedClaims`, `allowPrivateIPJWKSHosts`, `openIDProvider` (true for
    # the provider whose accepted bearers are used as ID tokens),
    # and `certificateAuthority` with a `secretKeyRef` or `configMapKeyRef`
    # (`name`, `key`). Empty trusts the provider people sign in with
    # (`authorizationServer.upstream`) as `openIDProvider`: its ID tokens are
    # accepted as bearer tokens, a deviation from MCP's audience rule until
    # per-backend tokens (ID-JAG, giantswarm/giantswarm#39102). They are
    # accepted for `oauth.trustedAudiences`, else `global.identity.clientId`,
    # else `authorizationServer.upstream.client.id`, together with
    # `muster.mcpServer.auth.requiredAudiences`,
    # in that order and without duplicates.
    trustedIssuers: []  # @schema item: object ; itemRequired: [issuer, jwksURI, audiences] ; itemProperties: {issuer: {type: string}, jwksURI: {type: string}, audiences: {type: array, minItems: 1, items: {type: string}}, subjectClaim: {type: string, enum: ['', sub, email]}, acceptedTypHeaders: {type: array, items: {type: string}}, allowedClaims: {type: object, additionalProperties: {type: string}}, allowPrivateIPJWKSHosts: {type: array, items: {type: string}}, openIDProvider: {type: boolean}, certificateAuthority: {type: object, additionalProperties: false, properties: {secretKeyRef: {type: object, additionalProperties: false, required: [name, key], properties: {name: {type: string}, key: {type: string}}}, configMapKeyRef: {type: object, additionalProperties: false, required: [name, key], properties: {name: {type: string}, key: {type: string}}}}}}
    # -- Accept only tokens whose audience names this server's resource
    # (`OAUTH_REQUIRE_RESOURCE_ACCESS_TOKENS`), as MCP requires. Off while the
    # platform forwards ID tokens (giantswarm/giantswarm#39102).
    requireResourceAccessTokens: false
  # This server's own authorization server: people sign in through the
  # upstream provider and MCP clients get tokens from this server.
  authorizationServer:
    # -- Run the authorization server. Off makes cluster-manager a resource
    # server only (`OAUTH_ENABLE_AUTHORIZATION_SERVER=false`).
    enabled: true
    # -- Public base URL of this server, the issuer of its tokens and metadata
    # (`OAUTH_ISSUER`; https, or http on loopback). Empty uses the deprecated
    # `oauth.baseURL`, else `https://<fullname>.<global.domain>`. Required also
    # with this authorization server disabled: the library uses this public
    # base URL for resource metadata; it does not advertise an active AS.
    issuer: ""
    upstream:
      # -- The OpenID Provider people sign in with: `dex` or `google`
      # (`OAUTH_PROVIDER`). Empty uses the deprecated `oauth.provider`, else
      # `dex`.
      type: ""  # @schema enum: ["", dex, google]
      # -- Dex issuer URL. Empty uses the deprecated `oauth.dex.issuerURL`,
      # else `global.identity.issuerUrl`.
      issuer: ""
      client:
        # -- OAuth client ID at the provider. Empty uses the deprecated
        # `oauth.dex.clientID` or `oauth.google.clientID`, else
        # `global.identity.clientId` (dex).
        id: ""
        # -- Secret key with the client secret, mounted as a file. Empty name
        # uses the deprecated `oauth.existingSecret`, else
        # `global.identity.existingSecret`, else a Secret from the deprecated
        # inline client secret.
        secretKeyRef:
          name: ""
          key: client-secret
      certificateAuthority:
        # -- Secret key with the CA of a Dex that serves a private
        # certificate (`OAUTH_DEX_CA_FILE`). Empty name uses the deprecated
        # `oauth.dex.caSecret`, else `global.identity.ca`.
        secretKeyRef:
          name: ""
          key: ca.crt
    dynamicClientRegistration:
      # -- Serve RFC 7591 dynamic client registration
      # (`OAUTH_ENABLE_DYNAMIC_CLIENT_REGISTRATION`). MCP 2026-07-28
      # deprecates it in favour of client ID metadata documents; it stays on
      # for clients that still register this way.
      enabled: true
      initialAccessToken:
        # -- Secret key with the RFC 7591 initial access token a
        # registration must present (mcp-oauth reads it from
        # `OAUTH_INITIAL_ACCESS_TOKEN_FILE`).
        secretKeyRef:
          name: ""
          key: token
    clientIDMetadataDocuments:
      # -- Accept URL client IDs (client ID metadata documents)
      # (`OAUTH_ENABLE_CLIENT_ID_METADATA_DOCUMENTS`).
      enabled: true
    storage:
      # -- Token storage (`OAUTH_STORAGE_BACKEND`). Memory loses every
      # session on restart and needs one replica.
      type: memory  # @schema enum: [memory]
  # -- Deprecated: use `authorizationServer.issuer`.
  baseURL: ""
  # -- Deprecated: use `authorizationServer.upstream.type`.
  provider: ""  # @schema enum: ["", dex, google]
  dex:
    # -- Deprecated: use `authorizationServer.upstream.issuer`.
    issuerURL: ""
    # -- Deprecated: use `authorizationServer.upstream.client.id`.
    clientID: ""
    # -- Deprecated: use `authorizationServer.upstream.client.secretKeyRef`.
    clientSecret: ""
    # -- Deprecated, no effect, not passed to the server: the Dex client
    # reaches private addresses and follows HTTP_PROXY, HTTPS_PROXY and
    # NO_PROXY without it. Remove it from your values; the key goes away in a
    # later release.
    allowPrivateURLs: false
    # -- Deprecated: use `authorizationServer.upstream.certificateAuthority`.
    caSecret:
      name: ""
      key: ca.crt
  google:
    # -- Deprecated: use `authorizationServer.upstream.client.id`. Empty
    # reads the Secret key `google-client-id`.
    clientID: ""
    # -- Deprecated: use `authorizationServer.upstream.client.secretKeyRef`.
    clientSecret: ""
  # -- Deprecated: use `authorizationServer.upstream.client.secretKeyRef`.
  # Existing Secret with `dex-client-secret` (dex) or `google-client-secret`
  # (+ optional `google-client-id`) (google).
  existingSecret: ""
  # -- Deprecated: list the provider in `resourceServer.trustedIssuers` with
  # these `audiences`. The OAuth client IDs whose ID tokens of the provider
  # people sign in with are accepted.
  trustedAudiences: []  # @schema item: string
  sso:
    # -- Deprecated, no effect, not passed to the server: the issuer host of
    # the configured provider may resolve to a private address for its JWKS
    # without it; list any other JWKS host in allowPrivateIPJWKSHosts. Remove
    # it from your values; the key goes away in a later release.
    allowPrivateIPs: false
    # -- Deprecated: list the provider in `resourceServer.trustedIssuers`
    # with these `allowPrivateIPJWKSHosts`. Hosts, other than the issuer's
    # own, whose JWKS may resolve to an RFC 1918 or RFC 4193 address.
    allowPrivateIPJWKSHosts: []  # @schema item: string
  # -- Deprecated, removed in a later release: accept dynamic client
  # registration without an initial access token, public clients included
  # (labs only). MCP clients register with client ID metadata documents.
  allowPublicClientRegistration: false
  downstream:
    # -- Call the Kubernetes API as the caller: everything a request does
    # presents the caller's IdP token, so the caller's RBAC governs — the
    # apiserver must trust the IdP and the token's audience (a Dex install
    # lists that audience in `muster.mcpServer.auth.requiredAudiences`; a
    # Google install's client id is the apiserver's `--oidc-client-id`). This
    # is cluster-manager's rule (every write as the person), so it is on by
    # default and takes effect with `oauth.enabled`. The ServiceAccount then
    # holds no permissions: the chart renders no RBAC for it (`rbac.create`
    # is moot).
    enabled: true

github:
  # -- Offer commit mode (`mode: commit` on `create_cluster`,
  # `delete_cluster`, `create_node_pool` and `delete_node_pool`: the pull
  # request opened as the person in the repository that owns the cluster).
  # Needs `oauth.enabled` and `tokenExchange.tokenEndpoint`: muster keeps
  # forwarding the person's ID token as the bearer
  # (`muster.mcpServer.auth.forwardToken`) and the server fetches the
  # person's GitHub App user token for each commit (RFC 8693). Off: commit
  # mode is refused.
  enabled: false
  # -- GitHub's REST API, for `GET /user` and the pull request.
  apiURL: https://api.github.com
  tokenExchange:
    # -- RFC 8693 token endpoint (muster's broker) that releases the person's
    # GitHub App user token for a commit. Set: only a commit asks for GitHub,
    # and one without the person's grant answers `grant_required` naming
    # `audience`. Needs `github.enabled`, `oauth.enabled` with Dex,
    # `oauth.downstream.enabled` and `muster.mcpServer.auth.forwardToken`;
    # required with `github.enabled`.
    tokenEndpoint: ""
    # -- RFC 8693 audience: the App whose grant the broker releases. Also the
    # App named in `grant_required` answers and listed under the MCPServer's
    # `auth.providerApps`, so muster answers with that App's sign-in link.
    # The App needs contents and pull-request write on every repository a
    # commit targets. Required with `tokenEndpoint`.
    audience: ""  # @schema pattern: ^$|^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
    # -- Confidential broker client ID. Empty: read from the Secret's
    # `client-id` key.
    clientID: ""
    # -- Confidential broker client secret; the chart renders it into a
    # Secret. Prefer `existingSecret`, which wins when both are set.
    clientSecret: ""
    # -- Existing Secret in the release namespace with `client-secret` (and
    # `client-id` when `clientID` is empty).
    existingSecret: ""
    # -- Optional existing Secret with `ca.crt` for the broker's private CA.
    caSecretName: ""

muster:
  mcpServer:
    # -- Register this server with muster by rendering an
    # `mcpservers.muster.giantswarm.io` CR in the release namespace. Tools then
    # appear as `x_<name>_<tool>`.
    enabled: false
    # -- MCPServer CR name (drives the tool prefix).
    name: cluster-manager
    # -- Human-friendly name the Dev Portal shows for this server, rendered as
    # the `ui.giantswarm.io/display-name` annotation. Empty renders none.
    displayName: Cluster Manager
    # -- Start the server connection when muster initializes.
    autoStart: true
    # -- Human-readable description shown by muster.
    description: Clusters and GPU node pools of this installation (list, and the node-pool writes as the person) for the Agent Platform
    # -- Extra labels on the MCPServer CR.
    labels: {}  # @schema additionalProperties: true
    # -- How muster authenticates to this server; rendered only with
    # `oauth.enabled`. `forwardToken` makes muster forward the session's IdP
    # id_token byte-identical (the SSO path this chart trusts through its
    # trusted audiences). `requiredAudiences` are extra audiences that token
    # must carry — the Dex cross-client audience the kube-apiserver trusts
    # (`dex-k8s-authenticator` on Giant Swarm clusters; agentlab's is
    # `kubernetes`) so `oauth.downstream` works; muster requests them at
    # login, so users re-login after a change. They are trusted as bearer
    # audiences by construction, since the server's trusted audiences are
    # `oauth.trustedAudiences` plus this list. A Google IdP has no
    # cross-client audiences: leave the list empty.
    auth:
      forwardToken: true
      requiredAudiences: []

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount.
  annotations: {}  # @schema additionalProperties: true
  # -- ServiceAccount name (generated when empty).
  name: ""

rbac:
  # -- Create the read-only ClusterRole/ClusterRoleBinding (Cluster API
  # clusters, machine pools, control planes and infrastructure, Flux
  # HelmReleases, Giant Swarm Releases) — the ServiceAccount's own
  # permissions for a release without OAuth. Ignored with `oauth.enabled` and
  # `oauth.downstream.enabled`: the ServiceAccount then gets no RBAC at all.
  create: true

# -- Annotations on the pod.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod.
podLabels: {}  # @schema additionalProperties: true

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (container listens on 8080).
  port: 8080

# -- Container resources. ephemeral-storage covers the `tmp` emptyDir
# mounted at /tmp, which holds only the Go runtime's scratch files.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 128Mi

tmpVolume:
  # -- Size limit of the `tmp` emptyDir mounted at /tmp; the kubelet evicts
  # the pod when the volume grows past it. Empty sets no limit.
  sizeLimit: 128Mi

logging:
  # -- Enable debug logging.
  verbose: false

observability:
  otel:
    # -- OTLP collector the server exports its traces to
    # (`OTEL_EXPORTER_OTLP_ENDPOINT`), e.g.
    # `http://otlp-gateway.kube-system.svc:4317` for gRPC. Empty exports
    # nothing; the W3C propagator still honours an inbound `traceparent`.
    endpoint: ""
    # -- OTLP protocol: `grpc` or `http/protobuf`
    # (`OTEL_EXPORTER_OTLP_PROTOCOL`).
    protocol: grpc
    # -- Extra OTLP headers as `key=value,...` (`OTEL_EXPORTER_OTLP_HEADERS`),
    # e.g. `X-Scope-OrgID=giantswarm` for the collector's tenant.
    headers: ""
    # -- Extra resource attributes as `key=value,...`, appended to the pod's
    # `k8s.pod.name`, `k8s.namespace.name` and `k8s.node.name`
    # (`OTEL_RESOURCE_ATTRIBUTES`).
    resourceAttributes: ""
    # -- Trace sampler (`OTEL_TRACES_SAMPLER`). Parent-based: a call
    # arriving with a sampled `traceparent` (muster's) is always kept, a root
    # span is sampled at `samplerArg`.
    sampler: parentbased_traceidratio
    # -- Sampler argument (`OTEL_TRACES_SAMPLER_ARG`): the ratio of root spans kept.
    samplerArg: "0.1"
  metrics:
    # -- Serve Prometheus metrics on `GET /metrics` of the `metrics` port:
    # `mcp_server_operation_duration_seconds` per tool, and
    # `http_server_request_duration_seconds` for the REST API and the MCP
    # endpoint. Off, `OTEL_METRICS_EXPORTER=none`: nothing is served, and
    # nothing is pushed to `observability.otel.endpoint` either.
    enabled: true
    # -- Port of the metrics listener, apart from the API port so an
    # HTTPRoute or the OAuth guard never covers it.
    port: 9464

serviceMonitor:
  # -- Render a ServiceMonitor for the `metrics` port. Also needs
  # `observability.metrics.enabled`; the meta chart turns this on with the
  # tenant label.
  enabled: false
  # -- Scrape interval; empty uses the Prometheus Operator default.
  interval: ""
  # -- Labels on the ServiceMonitor, beside the chart's own. The Giant Swarm
  # observability platform routes a scrape to a Mimir tenant by
  # `observability.giantswarm.io/tenant`; a monitor without it writes to no
  # tenant.
  labels: {}  # @schema additionalProperties: true

# -- Extra container arguments.
extraArgs: []
# -- Extra environment variables.
extraEnv: []  # @schema item: object ; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}

# -- Node selector.
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations.
tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
# -- Affinity.
affinity: {}  # @schema additionalProperties: true
