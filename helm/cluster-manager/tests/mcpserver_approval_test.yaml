# The MCPServer's tool approval: written out explicitly by the chart (the
# "Allow all" preset), overridable per tool, dropped with null, and bound by the
# values schema (Allow | Ask | Block per tool, Allow | Ask | Block for the rule).
#
# Run with: helm unittest helm/cluster-manager
suite: mcpserver tool approval
templates:
  - templates/mcpserver.yaml
release:
  name: cluster-manager
  namespace: agent-platform
set:
  muster:
    mcpServer:
      enabled: true
tests:
  - it: sets the tool approval explicitly, the "Allow all" preset
    asserts:
      - equal:
          path: spec.approval.rule
          value: Allow
      - equal:
          path: spec.approval.tools.list_clusters
          value: Allow
      - equal:
          path: spec.approval.tools.delete_cluster
          value: Allow
      - equal:
          path: spec.approval.tools.remove_model_cache
          value: Allow

  - it: renders an installation's override of one tool
    set:
      muster:
        mcpServer:
          approval:
            tools:
              delete_cluster: Ask
    asserts:
      - equal:
          path: spec.approval.tools.delete_cluster
          value: Ask
      - equal:
          path: spec.approval.tools.create_cluster
          value: Allow

  - it: renders no approval when it is null
    set:
      muster:
        mcpServer:
          approval: null
    asserts:
      - notExists:
          path: spec.approval

  - it: renders a rule of Block, which hides and refuses every tool without its own entry
    set:
      muster:
        mcpServer:
          approval:
            rule: Block
    asserts:
      - equal:
          path: spec.approval.rule
          value: Block

  - it: refuses a rule the CRD does not allow
    set:
      muster:
        mcpServer:
          approval:
            rule: Deny
    asserts:
      - failedTemplate: {}
