{{- if include "cluster-manager.oauthRendersSecret" . }}
{{- /*
Provider credentials from the deprecated inline values, when no Secret is
named (no authorizationServer.upstream.client.secretKeyRef, oauth.existingSecret
or global.identity.existingSecret).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-manager.fullname" . }}-oauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq (include "cluster-manager.oauthProvider" .) "google" }}
  google-client-secret: {{ required "oauth.google.clientSecret or oauth.existingSecret is required when oauth.enabled with the google provider" .Values.oauth.google.clientSecret | quote }}
  {{- with .Values.oauth.google.clientID }}
  google-client-id: {{ . | quote }}
  {{- end }}
  {{- else }}
  dex-client-secret: {{ required "oauth.dex.clientSecret or oauth.existingSecret is required when oauth.enabled" .Values.oauth.dex.clientSecret | quote }}
  {{- end }}
{{- end }}
