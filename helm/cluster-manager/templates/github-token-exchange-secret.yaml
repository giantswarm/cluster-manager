{{- if and (include "cluster-manager.githubTokenExchange" .) (not .Values.github.tokenExchange.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-manager.githubTokenExchangeSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.github.tokenExchange.clientSecret | quote }}
  {{- with .Values.github.tokenExchange.clientID }}
  client-id: {{ . | quote }}
  {{- end }}
{{- end }}
