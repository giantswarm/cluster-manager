apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "cluster-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cluster-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cluster-manager.serviceAccountName" . }}
      {{- /*
      The token stays mounted even with oauth.downstream: it carries the
      in-cluster API address and CA; every call presents the caller's token
      instead of it (rbac.yaml renders nothing for the ServiceAccount then).
      */}}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:8080
            - --in-cluster=true
            {{- with .Values.installation.name }}
            - --installation={{ . }}
            {{- end }}
            - --model-manager-namespace={{ .Values.modelManager.namespace }}
            - --serving-namespace={{ .Values.serving.namespace }}
            - --serving-cache-claim={{ .Values.serving.cacheClaim }}
            {{- with .Values.serving.sliceChartVersion }}
            - --slice-chart-version={{ . }}
            {{- end }}
            - --tenant-service-account={{ .Values.flux.tenantServiceAccount }}
            - --models-certificate-issuer={{ .Values.serving.certificateIssuer }}
            - --gpu-operator-dcgm-exporter={{ .Values.gpuOperator.dcgmExporter }}
            - --mcp-enabled={{ .Values.mcp.enabled }}
            - --mcp-path={{ .Values.mcp.path }}
            {{- if .Values.oauth.enabled }}
            - --enable-oauth=true
            {{- if .Values.oauth.downstream.enabled }}
            - --downstream-oauth=true
            {{- end }}
            {{- if include "cluster-manager.githubTokenExchange" . }}
            {{- with .Values.github.tokenExchange }}
            - --github-token-exchange-endpoint={{ .tokenEndpoint }}
            - --github-token-exchange-audience={{ .audience }}
            {{- with .clientID }}
            - --github-token-exchange-client-id={{ . }}
            {{- end }}
            - --github-token-exchange-client-id-file=/etc/cluster-manager/github-token-exchange/client-id
            - --github-token-exchange-client-secret-file=/etc/cluster-manager/github-token-exchange/client-secret
            {{- if .caSecretName }}
            - --github-token-exchange-ca-file=/etc/cluster-manager/github-token-exchange-ca/ca.crt
            {{- end }}
            {{- end }}
            - --github-api-url={{ .Values.github.apiURL }}
            {{- end }}
            {{- if eq (include "cluster-manager.oauthProvider" .) "dex" }}
            {{- with .Values.createdClusters.oidc.clientID | default (first (include "cluster-manager.requiredAudiences" . | fromJsonArray)) }}
            - --cluster-oidc-client-id={{ . }}
            - --cluster-oidc-username-claim={{ $.Values.createdClusters.oidc.usernameClaim }}
            - --cluster-oidc-groups-claim={{ $.Values.createdClusters.oidc.groupsClaim }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.logging.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- with include "cluster-manager.otelEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.observability.metrics.enabled }}
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            - name: OTEL_EXPORTER_PROMETHEUS_HOST
              value: "0.0.0.0"
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: {{ .Values.observability.metrics.port | quote }}
            {{- else }}
            - name: OTEL_METRICS_EXPORTER
              value: none
            {{- end }}
            {{- if .Values.oauth.enabled }}
            {{- /* mcp-oauth's settings (oauthconfig.SettingsFromEnv). */}}
            {{- $oauth := include "cluster-manager.oauth" . | fromJson }}
            {{- $rs := .Values.oauth.resourceServer }}
            {{- $as := .Values.oauth.authorizationServer }}
            - name: OAUTH_ISSUER
              value: {{ $oauth.issuer | quote }}
            {{- with $rs.resource }}
            - name: OAUTH_RESOURCE
              value: {{ . | quote }}
            {{- end }}
            {{- with $rs.additionalResources }}
            - name: OAUTH_ADDITIONAL_RESOURCES
              value: {{ $resources := list }}{{ range . }}{{ $resources = append $resources (dict "resource" .) }}{{ end }}{{ toJson $resources | quote }}
            {{- end }}
            {{- with $rs.authorizationServers }}
            - name: OAUTH_AUTHORIZATION_SERVERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $oauth.trustedIssuers }}
            - name: OAUTH_TRUSTED_ISSUERS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if $rs.requireResourceAccessTokens }}
            - name: OAUTH_REQUIRE_RESOURCE_ACCESS_TOKENS
              value: "true"
            {{- end }}
            {{- if not $oauth.authorizationServer }}
            - name: OAUTH_ENABLE_AUTHORIZATION_SERVER
              value: "false"
            {{- else }}
            - name: OAUTH_PROVIDER
              value: {{ $oauth.provider | quote }}
            - name: OAUTH_STORAGE_BACKEND
              value: {{ $as.storage.type | quote }}
            - name: OAUTH_ENABLE_CLIENT_ID_METADATA_DOCUMENTS
              value: {{ $as.clientIDMetadataDocuments.enabled | quote }}
            {{- if not $as.dynamicClientRegistration.enabled }}
            - name: OAUTH_ENABLE_DYNAMIC_CLIENT_REGISTRATION
              value: "false"
            {{- end }}
            {{- if $as.dynamicClientRegistration.initialAccessToken.secretKeyRef.name }}
            - name: OAUTH_INITIAL_ACCESS_TOKEN_FILE
              value: /etc/cluster-manager/oauth-registration/token
            {{- end }}
            {{- if .Values.oauth.allowPublicClientRegistration }}
            - name: OAUTH_ALLOW_PUBLIC_CLIENT_REGISTRATION
              value: "true"
            {{- end }}
            {{- if eq $oauth.provider "google" }}
            {{- with $oauth.clientIDSecret }}
            - name: OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- else }}
            - name: OAUTH_GOOGLE_CLIENT_ID
              value: {{ $oauth.clientID | quote }}
            {{- end }}
            - name: OAUTH_GOOGLE_CLIENT_SECRET_FILE
              value: /etc/cluster-manager/oauth-client/client-secret
            - name: OAUTH_GOOGLE_REDIRECT_URL
              value: {{ printf "%s/oauth/callback" ($oauth.issuer | trimSuffix "/") | quote }}
            {{- else }}
            - name: OAUTH_DEX_ISSUER_URL
              value: {{ required "oauth.authorizationServer.upstream.issuer (or global.identity.issuerUrl) is required for the dex provider" $oauth.upstreamIssuer | quote }}
            - name: OAUTH_DEX_CLIENT_ID
              value: {{ required "oauth.authorizationServer.upstream.client.id (or global.identity.clientId) is required for the dex provider" $oauth.clientID | quote }}
            - name: OAUTH_DEX_CLIENT_SECRET_FILE
              value: /etc/cluster-manager/oauth-client/client-secret
            {{- with $oauth.upstreamCA }}
            - name: OAUTH_DEX_CA_FILE
              value: {{ printf "%s/%s" .dir .key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
              protocol: TCP
            {{- end }}
          # Up to 5m30s to serve /healthz: building the Dex provider waits up to
          # 5 minutes for an unavailable Dex, and liveness only starts after this.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 33
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $githubExchange := include "cluster-manager.githubTokenExchange" . }}
          {{- $oauth := dict "mounts" list }}
          {{- if .Values.oauth.enabled }}{{ $oauth = include "cluster-manager.oauth" . | fromJson }}{{ end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range $oauth.mounts }}
            - name: {{ .volume }}
              mountPath: {{ .dir }}
              readOnly: true
            {{- end }}
            {{- if $oauth.authorizationServer }}
            - name: oauth-client
              mountPath: /etc/cluster-manager/oauth-client
              readOnly: true
            {{- if .Values.oauth.authorizationServer.dynamicClientRegistration.initialAccessToken.secretKeyRef.name }}
            - name: oauth-registration
              mountPath: /etc/cluster-manager/oauth-registration
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $githubExchange }}
            - name: github-token-exchange
              mountPath: /etc/cluster-manager/github-token-exchange
              readOnly: true
            {{- if .Values.github.tokenExchange.caSecretName }}
            - name: github-token-exchange-ca
              mountPath: /etc/cluster-manager/github-token-exchange-ca
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          {{- with .Values.tmpVolume.sizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- range $oauth.mounts }}
        - name: {{ .volume }}
          {{- if .secret }}
          secret:
            secretName: {{ .secret }}
          {{- else }}
          configMap:
            name: {{ .configMap }}
          {{- end }}
            items:
              - key: {{ .key }}
                path: {{ .key }}
        {{- end }}
        {{- if $oauth.authorizationServer }}
        - name: oauth-client
          secret:
            secretName: {{ $oauth.clientSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ $oauth.clientSecret.key }}
                path: client-secret
        {{- with .Values.oauth.authorizationServer.dynamicClientRegistration.initialAccessToken.secretKeyRef }}
        {{- if .name }}
        - name: oauth-registration
          secret:
            secretName: {{ .name }}
            defaultMode: 0440
            items:
              - key: {{ required "oauth.authorizationServer.dynamicClientRegistration.initialAccessToken.secretKeyRef.key is required with its name" .key }}
                path: token
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if $githubExchange }}
        - name: github-token-exchange
          secret:
            secretName: {{ include "cluster-manager.githubTokenExchangeSecretName" . }}
            defaultMode: 0440
        {{- if .Values.github.tokenExchange.caSecretName }}
        - name: github-token-exchange-ca
          secret:
            secretName: {{ .Values.github.tokenExchange.caSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
