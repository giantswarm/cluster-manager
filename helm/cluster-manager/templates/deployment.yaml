apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cluster-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cluster-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cluster-manager.serviceAccountName" . }}
      {{- /*
      The token stays mounted even with oauth.downstream: it carries the
      in-cluster API address and CA; every call presents the caller's token
      instead of it (rbac.yaml renders nothing for the ServiceAccount then).
      */}}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:8080
            - --in-cluster=true
            {{- with .Values.installation.name }}
            - --installation={{ . }}
            {{- end }}
            - --model-manager-namespace={{ .Values.modelManager.namespace }}
            - --serving-namespace={{ .Values.serving.namespace }}
            {{- with .Values.serving.sliceChartVersion }}
            - --slice-chart-version={{ . }}
            {{- end }}
            - --tenant-service-account={{ .Values.flux.tenantServiceAccount }}
            - --models-certificate-issuer={{ .Values.serving.certificateIssuer }}
            - --mcp-enabled={{ .Values.mcp.enabled }}
            - --mcp-path={{ .Values.mcp.path }}
            {{- if .Values.oauth.enabled }}
            - --enable-oauth=true
            - --oauth-base-url={{ include "cluster-manager.oauthBaseURL" . }}
            - --oauth-provider={{ .Values.oauth.provider }}
            {{- with include "cluster-manager.oauthTrustedAudiences" . }}
            - --oauth-trusted-audiences={{ . }}
            {{- end }}
            {{- if .Values.oauth.sso.allowPrivateIPs }}
            - --sso-allow-private-ips=true
            {{- end }}
            {{- if .Values.oauth.allowPublicClientRegistration }}
            - --allow-public-client-registration=true
            {{- end }}
            {{- if .Values.oauth.downstream.enabled }}
            - --downstream-oauth=true
            {{- end }}
            {{- if eq .Values.oauth.provider "dex" }}
            - --dex-issuer-url={{ include "cluster-manager.oauthDexIssuerURL" . }}
            - --dex-client-id={{ include "cluster-manager.oauthDexClientID" . }}
            {{- if .Values.oauth.dex.allowPrivateURLs }}
            - --allow-private-oauth-urls=true
            {{- end }}
            {{- if include "cluster-manager.oauthDexCASecretName" . }}
            - --dex-ca-file=/etc/cluster-manager/idp-ca/{{ include "cluster-manager.oauthDexCASecretKey" . }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.logging.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.oauth.enabled .Values.extraEnv }}
          env:
            {{- if .Values.oauth.enabled }}
            {{- if eq .Values.oauth.provider "google" }}
            {{- if .Values.oauth.google.clientID }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.oauth.google.clientID | quote }}
            {{- else }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cluster-manager.oauthSecretName" . }}
                  key: google-client-id
            {{- end }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cluster-manager.oauthSecretName" . }}
                  key: google-client-secret
            {{- else }}
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cluster-manager.oauthSecretName" . }}
                  key: dex-client-secret
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $idpCA := "" }}
          {{- if and .Values.oauth.enabled (eq .Values.oauth.provider "dex") }}{{ $idpCA = include "cluster-manager.oauthDexCASecretName" . }}{{ end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $idpCA }}
            - name: idp-ca
              mountPath: /etc/cluster-manager/idp-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $idpCA }}
        - name: idp-ca
          secret:
            secretName: {{ $idpCA }}
            items:
              - key: {{ include "cluster-manager.oauthDexCASecretKey" . }}
                path: {{ include "cluster-manager.oauthDexCASecretKey" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
