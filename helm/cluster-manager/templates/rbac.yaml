{{- /*
No RBAC at all with oauth.downstream: every Kubernetes call then carries the
caller's IdP token and the caller's RBAC governs; the ServiceAccount keeps only
what every authenticated principal has (API discovery). The token stays
mounted for the in-cluster API address and CA.
*/}}
{{- if and .Values.rbac.create (not (and .Values.oauth.enabled .Values.oauth.downstream.enabled)) }}
{{- /*
The tools, cluster-wide: Cluster API clusters and machine pools in every org-
namespace, the control plane and infrastructure objects they reference, the
cluster-scoped Giant Swarm Releases (the pool's pins; the control plane's
Kubernetes version when the control plane object is not readable), the
cluster's own values (the HelmRelease or App named like the cluster and its
ConfigMap), the teleport join-token Secret's presence, the kubeconfig
Secret's cluster section (apiserver and CA), and a pool release's prewarm
placeholder (its Job and pod in the release's org- namespace). The node-pool writes create,
update and delete the pool and operator releases' HelmRelease, OCIRepository
and values Secret in org- namespaces, and the kserve backend ConfigMap in
model-manager's namespace. The detection on the installation's own cluster
reads nodes, ClusterPolicies, the KServe APIs and the discovery ConfigMap;
a workload cluster is read through its own apiserver as the caller only.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cluster-manager.fullname" . }}-read
  labels:
    {{- include "cluster-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters", "machinepools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["controlplane.cluster.x-k8s.io", "infrastructure.cluster.x-k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["release.giantswarm.io"]
    resources: ["releases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["application.giantswarm.io"]
    resources: ["apps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nvidia.com"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "llminferenceservices"]
    verbs: ["list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cluster-manager.fullname" . }}-read
  labels:
    {{- include "cluster-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cluster-manager.fullname" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
