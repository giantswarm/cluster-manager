{{- if and .Values.github.enabled (not .Values.oauth.enabled) }}
{{- fail "github.enabled registers the commit MCPServer pinned to the GitHub App, which forwards the person's ID token next to its user token for the server to validate as an OAuth resource server: set oauth.enabled" }}
{{- end }}
{{- if .Values.muster.mcpServer.enabled }}
{{- /*
Registers this server with muster. Tools appear as x_<name>_<tool>. With
oauth.enabled the CR carries the auth block: muster forwards the session's IdP
id_token (forwardToken), which this server validates against its trusted
audiences (oauth.trustedAudiences plus the requiredAudiences below), and
requests the requiredAudiences at login. Without OAuth muster connects
anonymously. This registration serves every tool whatever github.enabled says:
nothing but commit mode waits for the GitHub App's consent.

The chart's labels, the muster identity (muster.giantswarm.io/type) and the
Agent Platform tier (agent-platform.giantswarm.io/tool-group: agent-platform,
the platform's own management surface -- the tier the portal, the toolset
presets and the docs group this server under). muster.mcpServer.labels adds to
and overrides all of them.
*/}}
{{- $labels := include "cluster-manager.labels" . | fromYaml }}
{{- $labels = mergeOverwrite $labels (dict "muster.giantswarm.io/type" "cluster-manager" "agent-platform.giantswarm.io/tool-group" "agent-platform") (.Values.muster.mcpServer.labels | default dict) }}
{{- $base := printf "http://%s.%s.svc.cluster.local:%v" (include "cluster-manager.fullname" .) .Release.Namespace .Values.service.port }}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: {{ $base }}{{ .Values.mcp.path }}
  {{- with .Values.muster.mcpServer.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- if .Values.oauth.enabled }}
  auth:
    type: oauth
    forwardToken: {{ .Values.muster.mcpServer.auth.forwardToken }}
    {{- with .Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- if .Values.github.enabled }}
{{- /*
The commit registration, <name>-commit: the server's commit path, which serves
the tools with a commit mode (create_node_pool, delete_node_pool) and get_info.
Its auth pins the GitHub App giantswarm-cluster-manager: the bearer is the
person's App user token (commit mode's pull request) and forwardIdentity puts
the ID token in X-Muster-Id-Token next to it. Only a person who wants a pull
request opened in their name connects it.
*/}}
{{- with .Values.github.authorizationServer }}
---
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ include "cluster-manager.commitRegistration" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  autoStart: {{ $.Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: {{ $base }}{{ $.Values.mcp.commitPath }}
  description: {{ printf "Commit mode of %s: create_node_pool and delete_node_pool open the node pool's pull request as the person, through the GitHub App" $.Values.muster.mcpServer.name | quote }}
  auth:
    type: oauth
    authorizationServer:
      issuer: {{ .issuer | quote }}
      {{- with .expectedIssuer }}
      expectedIssuer: {{ . | quote }}
      {{- end }}
      authorizationEndpoint: {{ .authorizationEndpoint | quote }}
      tokenEndpoint: {{ .tokenEndpoint | quote }}
      {{- with .scopes }}
      scopes: {{ . | quote }}
      {{- end }}
      clientCredentialsSecretRef:
        name: {{ .clientCredentialsSecretRef.name | quote }}
        namespace: {{ .clientCredentialsSecretRef.namespace | default $.Release.Namespace | quote }}
      grantScope: {{ .grantScope | quote }}
    forwardIdentity: true
    {{- with $.Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
